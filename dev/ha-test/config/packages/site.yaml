# The site: what the house draws, what the array makes, what the pack is doing
# - and the grid CTs DERIVED from all three.
#
# Deriving the meter rather than making it a fourth slider is the whole point.
# On a real site the CTs are downstream of the physics: grant a load 3 kW and
# the meter moves by 3 kW a few seconds later, which is what the engine's
# feedback loop is built around. Independent sliders would let you set states
# no site can be in (exporting 10 kW while the array makes nothing) and the
# loop would spend every cycle fighting you.
#
#   grid[p] = household[p] + managed[p] − inverter[p]
#   inverter total = solar − battery power   (+ charge consumes, − discharge adds)
#
# Positive = importing, which is the sign convention the engine reads (there is
# an "invert phases" option for sites wired the other way).

# A few knobs below carry an explicit `initial:`, and only those that need it.
# Home Assistant starts an input_number at its MINIMUM on a fresh config, and
# for some of these that minimum is actively misleading: −15 kW of phantom
# battery discharge, 200 V, a lag toggle that defaults to off and so disables
# the measurement delay entirely, a 5 °C tank. Those keep an `initial:`.
#
# The rest deliberately do NOT, because `initial:` also means the value is
# RESET on every restart - and you restart often while editing the component,
# which was quietly wiping the scenario each time. Without it Home Assistant
# restores what you last set, and the minimum (0 W of solar, 0 W of household)
# is a perfectly sane fresh-config starting point anyway.
input_number:
  sim_household_a:
    name: Household phase A
    min: 0
    max: 11000
    step: 50
    mode: box
    unit_of_measurement: W
    icon: mdi:home-lightning-bolt
  sim_household_b:
    name: Household phase B
    min: 0
    max: 11000
    step: 50
    mode: box
    unit_of_measurement: W
    icon: mdi:home-lightning-bolt
  sim_household_c:
    name: Household phase C
    min: 0
    max: 11000
    step: 50
    mode: box
    unit_of_measurement: W
    icon: mdi:home-lightning-bolt

  sim_export_limit:
    name: Export limit
    min: 0
    max: 25000
    step: 100
    mode: box
    unit_of_measurement: W
    icon: mdi:transmission-tower-export
    # Carries an `initial:` because the minimum is actively misleading: a 0 W
    # limit curtails the array to the household's own draw, which reads as a
    # broken inverter rather than a fresh config.
    initial: 11000

  sim_solar:
    name: Solar production
    min: 0
    max: 25000
    step: 100
    mode: box
    unit_of_measurement: W
    icon: mdi:solar-power-variant

  sim_battery_soc:
    name: Battery SOC
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-70
  sim_battery_power:
    name: Battery power (+ charging / − discharging)
    min: -15000
    max: 15000
    step: 100
    initial: 0
    mode: box
    unit_of_measurement: W
    icon: mdi:battery-charging

  sim_voltage:
    name: Phase voltage
    min: 200
    max: 250
    step: 1
    initial: 230
    mode: box
    unit_of_measurement: V
    icon: mdi:sine-wave

input_boolean:
  sim_lag:
    initial: "on"
    # Whether the measurements lag the physics, as real ones do. Off makes the
    # CTs report the current sample instead of the previous one, and the
    # station's input jump straight to its register - useful for isolating an
    # engine question from a timing one, but not a state any real site is in.
    name: Measurements lag the physics
    icon: mdi:timer-sand
  sim_curtail:
    initial: "on"
    # Whether the inverter holds its own export limit by throttling the array,
    # as a real one does. Off lets the site export past its limit, which no
    # site does - useful only to see what the array COULD have made.
    name: Inverter curtails to the export limit
    icon: mdi:solar-power-variant

input_select:
  sim_inverter_phases:
    # Which phases the inverter feeds - NOT which phases the site has (that is
    # decided by the CTs you pick in the config flow). Set it to A with the
    # grid on ABC to reproduce a single-phase array on a three-phase service.
    name: Inverter output phases
    options: ["A", "B", "C", "AB", "BC", "AC", "ABC"]
    initial: "ABC"
    icon: mdi:transmission-tower

template:
  - sensor:
      # The managed loads' draw per phase - every device package's contribution,
      # named ONE BY ONE and deliberately so.
      #
      # This used to match them with `states.sensor | selectattr('object_id',
      # 'match', ...)`. On 2026-09-08 that went stale (34 minutes behind), and
      # since the grid CTs are derived from these the whole simulated site froze
      # at whatever was drawing when HA booted - a tank that switched on later
      # did not exist to the meter. Iterating a domain was blamed (no trackable
      # dependency, rendered once), but on HA 2026.9.1 the form re-renders - a
      # new matching sensor joins within 1.5 s - so the real cause is unknown
      # (dev/ha-test/README.md, "Two traps").
      #
      # `states('...')` is a tracked access, so each of these updates the
      # instant its source does. Adding a device means adding a line here; the
      # `float(0)` default keeps the delete-a-package property, since a missing
      # entity contributes 0 rather than breaking the sum.
      - name: Sim site load A
        unique_id: sim_site_load_a
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {{ (states('sensor.sim_managed_plug_a') | float(0)
             + states('sensor.sim_managed_tank_a') | float(0)
             + states('sensor.sim_managed_station_a') | float(0)) | round(1) }}
      # The three phases summed, for plotting against solar and net export on
      # one axis - the per-phase split answers "which leg", this answers "how
      # much of the surplus did the loads actually take". Reads the phase
      # totals rather than the nine device sensors so it cannot drift from
      # them, and by explicit entity id so each access is tracked.
      - name: Sim managed load total
        unique_id: sim_managed_load_total
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {{ (states('sensor.sim_site_load_a') | float(0)
             + states('sensor.sim_site_load_b') | float(0)
             + states('sensor.sim_site_load_c') | float(0)) | round(1) }}
      - name: Sim site load B
        unique_id: sim_site_load_b
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {{ (states('sensor.sim_managed_plug_b') | float(0)
             + states('sensor.sim_managed_tank_b') | float(0)
             + states('sensor.sim_managed_station_b') | float(0)) | round(1) }}
      - name: Sim site load C
        unique_id: sim_site_load_c
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {{ (states('sensor.sim_managed_plug_c') | float(0)
             + states('sensor.sim_managed_tank_c') | float(0)
             + states('sensor.sim_managed_station_c') | float(0)) | round(1) }}

      # What the array COULD make, less whatever the pack is absorbing. The
      # potential, not the delivery - see the curtailment below.
      - name: Sim inverter potential
        unique_id: sim_inverter_potential
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {{ (states('input_number.sim_solar') | float(0)
             - states('input_number.sim_battery_power') | float(0)) | round(1) }}

      # What the inverter ACTUALLY delivers, which is what a real one does: it
      # holds its own export limit by throttling the array. No site exports
      # past its limit and apologises afterwards - the inverter simply stops
      # making the power, and the production sensor reads the lower figure.
      #
      # This is the physics that gives Excess mode its point. Without it the
      # rig exported 12.9 kW against an 11 kW limit and the difference was
      # scored as "tracking error", when a real site would have thrown it
      # away. With it, the surplus a load absorbs is power the site was about
      # to LOSE, and `Sim curtailed power` is the meter for what is still lost.
      #
      # Reads `Sim managed load total` deliberately: the inverter throttles
      # against total demand, so a managed load coming on is exactly what lets
      # it stop throttling. The dependency runs one way (register and relay ->
      # managed totals -> delivered -> legs -> CTs), so there is no loop.
      - name: Sim inverter delivered
        unique_id: sim_inverter_delivered
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {% set potential = states('sensor.sim_inverter_potential') | float(0) %}
          {% set demand = states('input_number.sim_household_a') | float(0)
                        + states('input_number.sim_household_b') | float(0)
                        + states('input_number.sim_household_c') | float(0)
                        + states('sensor.sim_managed_load_total') | float(0) %}
          {% set cap = [demand + states('input_number.sim_export_limit') | float(0), 0] | max %}
          {% if is_state('input_boolean.sim_curtail', 'on') %}
            {{ [potential, cap] | min | round(1) }}
          {% else %}
            {{ potential | round(1) }}
          {% endif %}

      # Production the site is throwing away. Invisible from the meter on a
      # real site, which is the whole difficulty: the engine cannot see this
      # number and has to infer surplus from how close export sits to a limit.
      - name: Sim curtailed power
        unique_id: sim_curtailed_power
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {{ [states('sensor.sim_inverter_potential') | float(0)
             - states('sensor.sim_inverter_delivered') | float(0), 0] | max | round(1) }}

      # The inverter's AC output per phase: the DELIVERED total spread over the
      # phases it actually feeds.
      - name: Sim inverter output A
        unique_id: sim_inverter_output_a
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {% set mask = states('input_select.sim_inverter_phases') %}
          {% set total = states('sensor.sim_inverter_delivered') | float(0) %}
          {{ (total / mask | length) | round(1) if 'A' in mask else 0 }}
      - name: Sim inverter output B
        unique_id: sim_inverter_output_b
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {% set mask = states('input_select.sim_inverter_phases') %}
          {% set total = states('sensor.sim_inverter_delivered') | float(0) %}
          {{ (total / mask | length) | round(1) if 'B' in mask else 0 }}
      - name: Sim inverter output C
        unique_id: sim_inverter_output_c
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {% set mask = states('input_select.sim_inverter_phases') %}
          {% set total = states('sensor.sim_inverter_delivered') | float(0) %}
          {{ (total / mask | length) | round(1) if 'C' in mask else 0 }}

      # The site's TRUE per-phase position, computed the instant anything
      # moves. Not what the engine reads - the sampled, lagging CTs further
      # down are, and these are the truth they lag behind.
      - name: Sim grid instant A
        unique_id: sim_grid_instant_a
        device_class: current
        unit_of_measurement: A
        state_class: measurement
        state: >
          {% set v = states('input_number.sim_voltage') | float(230) %}
          {% set w = states('input_number.sim_household_a') | float(0)
                   + states('sensor.sim_site_load_a') | float(0)
                   - states('sensor.sim_inverter_output_a') | float(0) %}
          {{ (w / v) | round(2) if v > 0 else 0 }}
      - name: Sim grid instant B
        unique_id: sim_grid_instant_b
        device_class: current
        unit_of_measurement: A
        state_class: measurement
        state: >
          {% set v = states('input_number.sim_voltage') | float(230) %}
          {% set w = states('input_number.sim_household_b') | float(0)
                   + states('sensor.sim_site_load_b') | float(0)
                   - states('sensor.sim_inverter_output_b') | float(0) %}
          {{ (w / v) | round(2) if v > 0 else 0 }}
      - name: Sim grid instant C
        unique_id: sim_grid_instant_c
        device_class: current
        unit_of_measurement: A
        state_class: measurement
        state: >
          {% set v = states('input_number.sim_voltage') | float(230) %}
          {% set w = states('input_number.sim_household_c') | float(0)
                   + states('sensor.sim_site_load_c') | float(0)
                   - states('sensor.sim_inverter_output_c') | float(0) %}
          {{ (w / v) | round(2) if v > 0 else 0 }}

      # Plain mirrors of the knobs, carrying the device_class and unit the
      # config flow's pickers filter on - an input_number is not offered for a
      # grid CT or a solar sensor however it is labelled.
      - name: Sim solar power
        unique_id: sim_solar_power
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: "{{ states('input_number.sim_solar') | float(0) | round(1) }}"
      - name: Sim battery SOC
        unique_id: sim_battery_soc
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        state: "{{ states('input_number.sim_battery_soc') | float(0) | round(0) }}"
      - name: Sim battery power
        unique_id: sim_battery_power
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: "{{ states('input_number.sim_battery_power') | float(0) | round(1) }}"
      - name: Sim phase voltage
        unique_id: sim_phase_voltage
        device_class: voltage
        unit_of_measurement: V
        state_class: measurement
        state: "{{ states('input_number.sim_voltage') | float(230) | round(1) }}"

      # A read-out for your own benefit: the site's net position in watts, so
      # you can see at a glance whether the site imports or exports without
      # doing the three-phase arithmetic in your head. On the TRUE basis, so it
      # moves the moment a load does - compare it with the engine's own grid
      # power sensor to watch the meter catch up.
      - name: Sim grid net power
        unique_id: sim_grid_net_power
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {% set v = states('input_number.sim_voltage') | float(230) %}
          {{ ((states('sensor.sim_grid_instant_a') | float(0)
             + states('sensor.sim_grid_instant_b') | float(0)
             + states('sensor.sim_grid_instant_c') | float(0)) * v) | round(0) }}

  # ------------------------------------------------------------------
  # The grid CTs the ENGINE reads. These are what you pick as phase A/B/C
  # current in the config flow.
  #
  # Sampled every 5 seconds, and each sample publishes the PREVIOUS one - so
  # the meter is 5 to 10 seconds behind the physics. That lag is not a detail:
  # it is the whole reason the engine smooths its readings, waits for a load's
  # draw to settle before trusting it, and can over-commit by granting power
  # twice against a surplus the first grant already spent. With instant CTs
  # none of that is reachable, and the rig would quietly pass a site the real
  # one fails.
  #
  # `this` is the entity's state BEFORE this run, so `this.attributes.pending`
  # holds the value computed one sample ago while `pending` is re-rendered to
  # the current one. That is the delay line, in two lines of Jinja.
  - trigger:
      - trigger: time_pattern
        seconds: "/5"
    sensor:
      - name: Sim grid current A
        unique_id: sim_grid_current_a
        device_class: current
        unit_of_measurement: A
        state_class: measurement
        state: >
          {% set now = states('sensor.sim_grid_instant_a') | float(0) %}
          {% if is_state('input_boolean.sim_lag', 'on') and this is not none %}
            {{ this.attributes.get('pending', now) | float(now) }}
          {% else %}
            {{ now }}
          {% endif %}
        attributes:
          pending: "{{ states('sensor.sim_grid_instant_a') | float(0) }}"
      - name: Sim grid current B
        unique_id: sim_grid_current_b
        device_class: current
        unit_of_measurement: A
        state_class: measurement
        state: >
          {% set now = states('sensor.sim_grid_instant_b') | float(0) %}
          {% if is_state('input_boolean.sim_lag', 'on') and this is not none %}
            {{ this.attributes.get('pending', now) | float(now) }}
          {% else %}
            {{ now }}
          {% endif %}
        attributes:
          pending: "{{ states('sensor.sim_grid_instant_b') | float(0) }}"
      - name: Sim grid current C
        unique_id: sim_grid_current_c
        device_class: current
        unit_of_measurement: A
        state_class: measurement
        state: >
          {% set now = states('sensor.sim_grid_instant_c') | float(0) %}
          {% if is_state('input_boolean.sim_lag', 'on') and this is not none %}
            {{ this.attributes.get('pending', now) | float(now) }}
          {% else %}
            {{ now }}
          {% endif %}
        attributes:
          pending: "{{ states('sensor.sim_grid_instant_c') | float(0) }}"

  # How far behind the meter currently is, in watts. When the engine
  # over-commits, this is the number it over-committed against.
  - sensor:
      - name: Sim ct lag error
        unique_id: sim_ct_lag_error
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >
          {% set v = states('input_number.sim_voltage') | float(230) %}
          {% set truth = states('sensor.sim_grid_instant_a') | float(0)
                       + states('sensor.sim_grid_instant_b') | float(0)
                       + states('sensor.sim_grid_instant_c') | float(0) %}
          {% set seen = states('sensor.sim_grid_current_a') | float(0)
                      + states('sensor.sim_grid_current_b') | float(0)
                      + states('sensor.sim_grid_current_c') | float(0) %}
          {{ ((truth - seen) * v) | round(0) }}
