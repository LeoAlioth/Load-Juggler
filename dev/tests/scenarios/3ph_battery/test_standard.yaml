# Test scenarios: Standard mode, three-phase sites, with battery

scenarios:

  - name: "3ph-3c-standard-prio-with-bat-normal"
    description: "3 chargers, all standard mode"
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 25
      max_import_power: 17250

      distribution_mode: priority
      solar_production: 4140  # 18A total
      phase_a_consumption: 3.0
      phase_b_consumption: 3.0
      phase_c_consumption: 3.0  # 9A total, 9 export
      battery_soc: 80
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 4140
      battery_max_discharge_power: 4140
      inverter_supports_asymmetric: True
      inverter_max_power_per_phase: 6000
      inverter_max_power: 12000
    loads:
      - entity_id: "load_1"
        operating_mode: Standard
        min_current: 6
        max_current: 16
        phases: 3
        priority: 1
      - entity_id: "load_2"
        operating_mode: Standard
        min_current: 6
        max_current: 16
        phases: 3
        priority: 2
      - entity_id: "load_3"
        operating_mode: Standard
        min_current: 6
        max_current: 10
        phases: 3
        priority: 3
    expected: # Manually verified expected result
      load_1:
        allocated: 16 # total available is 18A from solar, and 75A from grid and 18 A from battery = 111A total, 102 A afer load (34A per phase)
      load_2:
        allocated: 12 # 34A per phase is enough for 6A minimum for all 3 chargers, so after load_1 gets its 16A, 18A remains
      load_3:
        allocated: 6 # with charger 3 havin a 6A minimum, the charger 2 can only get 12A to keep the 3d one charging at all.

  - name: "3ph-1c-standard-heavy-importing"
    description: "Home consuming more than solar produces (importing)"
    human_verified: false
    # Found by the physical-invariant check 2026-09-07 (dev/TODO.md): phase A
    # carries 8 A of household against 4.33 A/phase of solar and 6 A/phase of
    # battery discharge, so it nets 2.33 A of export and its headroom is
    # 25 + 2.33 = 27.33 A IF the inverter's output stays where it is - the
    # harness spreads every inverter's output evenly over the phases.
    #
    # 2026-09-24: for a SYMMETRIC inverter that was a real double credit and
    # is fixed - the inverter pool now offers each phase its own export plus
    # its share of the battery headroom (the same site with a symmetric
    # inverter now gets 27.3 A, and no breach). THIS site declares an
    # ASYMMETRIC inverter, which the engine models as one pool it can place on
    # any phase, and the total is exact: 75 A of import allowance + 13 A of sun
    # + 18 A of battery - 21 A of house = 85 A = 3 x 28.3 A. Placing 11.3 /
    # 10.3 / 9.3 A of its 31 A on A / B / C keeps every phase at 25 A; the
    # harness's even 10.33 A per phase does not. So what is left is a question
    # about the hardware - does an asymmetric inverter place its output where
    # the breaker needs it - not an inverter output counted twice.
    known_invariant_breaches:
      - "phase A: 25.97 A drawn against a 25 A breaker"
    site:
      voltage: 230
      main_breaker_rating: 25
      max_import_power: 17250

      distribution_mode: priority
      solar_production: 2990  # 13A total
      phase_a_consumption: 8.0
      phase_b_consumption: 7.0
      phase_c_consumption: 6.0  # 21A total (importing 8A)
      battery_soc: 85
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 4140  # 18A
      battery_max_discharge_power: 4140  # 18A
      inverter_supports_asymmetric: true
      inverter_max_power_per_phase: 5980  # 26A
      inverter_max_power: 14950  # 65A
    loads:
      - entity_id: "load_1"
        operating_mode: Standard
        min_current: 6
        max_current: 32
        phases: 3
        priority: 1
    expected:
      load_1:
        allocated: 28.3  # Standard: grid(25+25+25=75A) + solar(13) + battery(18) - consumption(21) = 75+13+18-21=85A total pool, 85/3=28.3A per phase, limited by max_current 32A

  - name: "3ph-1c-standard-zero-solar-night"
    description: "Night time charging with no solar"
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 32
      max_import_power: 22080

      distribution_mode: priority
      solar_production: 0  # No solar
      phase_a_consumption: 2.0
      phase_b_consumption: 2.0
      phase_c_consumption: 2.0
      battery_soc: 85
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 4140  # 18A
      battery_max_discharge_power: 4140  # 18A
      inverter_supports_asymmetric: true
      inverter_max_power_per_phase: 5980  # 26A
      inverter_max_power: 14950  # 65A
    loads:
      - entity_id: "load_1"
        operating_mode: Standard
        min_current: 6
        max_current: 32
        phases: 3
        priority: 1
    expected:
      load_1:
        allocated: 32  # Standard: grid(30+30+30=90A) + battery(18A) = 108A. Per-phase: 30+(26-2)=54A. 108/3=36→capped at 32
