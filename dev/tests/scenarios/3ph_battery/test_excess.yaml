# Test scenarios: Excess mode, three-phase sites, with battery

scenarios:

  - name: "3ph-1c-excess-prio-with-bat-above-threshold"
    description: "Excess mode with export above threshold"
    human_verified: True
    site:
      voltage: 230
      main_breaker_rating: 25
      max_import_power: 17250

      distribution_mode: priority
      solar_production: 11840  # Total 18kW
      phase_a_consumption: 0
      phase_b_consumption: 0
      phase_c_consumption: 0  # 0A total,
      excess_export_threshold: 10000  # 10kW
      battery_soc: 97
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 4140
      battery_max_discharge_power: 4140
      inverter_supports_asymmetric: True
      inverter_max_power_per_phase: 6000
      inverter_max_power: 12000
    loads:
      - entity_id: "load_1"
        operating_mode: "Excess"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 1
    expected: # Manually verified expected result
      load_1:
        allocated: 8  # (11840- 10000W) / 230V  = 8A

  - name: "3ph-1c-excess-prio-with-bat-below-threshold"
    description: "Excess mode with export below threshold"
    human_verified: True
    site:
      voltage: 230
      main_breaker_rating: 25
      max_import_power: 17250

      distribution_mode: priority
      solar_production: 10350  # Total ~10.35kW
      phase_a_consumption: 1.0
      phase_b_consumption: 1.0
      phase_c_consumption: 1.0  # 3A total, ~8kW export
      excess_export_threshold: 10000  # 10kW
      battery_soc: 85
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 4140
      battery_max_discharge_power: 4140
      inverter_supports_asymmetric: True
      inverter_max_power_per_phase: 6000
      inverter_max_power: 12000
    loads:
      - entity_id: "load_1"
        operating_mode: "Excess"
        min_current: 6
        max_current: 16
        phases: 3
        priority: 1
    expected: # Manually verified expected result
      load_1:
        allocated: 0  # Below threshold

  # --- ISSUES.md #41: the Excess verdict must survive its own load ---------
  #
  # Both scenarios put a binary Excess plug on a phase that IMPORTS while the
  # other two export. Export stays gross and per-phase clamped - the import on
  # A buys no headroom for the export on B and C - so what has to hold is the
  # latch: the margin an engaged load reads must equal the margin the same site
  # would read with that load off. It failed when the inverter served the load
  # by charging the battery slower, because the draw was subtracted from one
  # phase's import (clamped to zero) while the charge term lost the whole draw.

  - name: "3ph-bat-excess-plug-unbalanced-battery-displaced-stays-on"
    description: >
      A PACK WITH HEADROOM LEFT IS NOT A SITE WITH SURPLUS - the case that
      inverted when the Excess verdict went net (2026-09-07).
      Household 10 A on phase A, 10 A/phase of solar, the battery taking 4.6 kW
      of its 5 kW allowance: the meter reads +6.67 A on A and -3.33 A on B and
      C. Read GROSS that was 1533 W of export - 133 W past the 1 kW trigger -
      because it counted the 3.33 A leaving on B and C and ignored the 6.67 A
      arriving on A. Read NET the site's position is exactly zero, so the
      margin is 0 + 4600 - (1000 + 5000) = -1400 W and the plug stays off.
      That is correct: the pack can still take 400 W, so nothing is spare.
      The gross figure remains right for the export LIMIT, which is what the
      charge-limit advice steers on.
      This is general on a battery site, not a quirk of these numbers: Excess
      needs solar - household >= threshold + charge allowance, and a site with
      that much surplus has already filled the pack to its allowance. So under
      the net verdict a battery site shows Excess only once its pack is
      SATURATED - which is the sibling scenario below.
      What this scenario was written for (ISSUES.md #41 - a running load must
      not suppress its own verdict) still holds here: the margin reads -1400 W
      with the plug off and -1400 W with it running. It is exercised with the
      plug actually ON by the export-displaced sibling below, and pinned
      directly in dev/tests/test_excess_stayon.py.
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 6900  # 10 A per phase
      phase_a_consumption: 10.0
      phase_b_consumption: 0
      phase_c_consumption: 0
      excess_export_threshold: 1000
      battery_soc: 60
      battery_soc_min: 20
      battery_soc_target: 80
      battery_soc_full: 97
      battery_max_charge_power: 5000
      battery_max_discharge_power: 5000
      inverter_max_power: 12000
    loads:
      - entity_id: "plug_1"
        device_type: "plug"
        operating_mode: "Excess"
        power_rating: 2000
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      plug_1:
        allocated: 0.0  # net verdict: the pack still has 400 W of headroom

  - name: "3ph-bat-excess-plug-unbalanced-export-displaced-stays-on"
    description: >
      The same importing-phase geometry with the battery saturated, so the
      plug's power comes out of export instead: 15 A/phase of solar against
      10 A of household on phase A, the battery pinned at its 5 kW charge
      allowance, and a 2 kW trigger. The meter reads +2.25 A on A and -7.75 A
      on B and C, so 3567 W of gross export against a 7 kW allowance gives
      3567 + 5000 - 7000 = +1567 W and the plug engages. Its 2 kW comes off
      export, the feedback loop hands the whole draw back (the battery has no
      headroom, so the reconstruction adds nothing), and the margin reads
      +1567 W again with the plug running: on for all 30 cycles.
      Read NET (2026-09-07) the site position is -2.25 + 7.75 + 7.75 = 13.25 A
      = 3047 W, so the margin is 3047 + 5000 - 7000 = +1047 W and Excess is
      still on. But this plug sits on phase A, the one IMPORTING 2.25 A, and an
      Excess load may not drive its own phase into import - that is precisely
      the power it exists to avoid buying. So it gets nothing here, and the
      export-displaced stay-on property is exercised by the phase-B twin below.
      A STANDARD load on this phase would still run: it reads the physical pool
      (the breaker, gross and per phase), because a grid-backed load is meant
      to import. Only Solar and Excess are refused.
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 10350  # 15 A per phase
      phase_a_consumption: 10.0
      phase_b_consumption: 0
      phase_c_consumption: 0
      excess_export_threshold: 2000
      battery_soc: 60
      battery_soc_min: 20
      battery_soc_target: 80
      battery_soc_full: 97
      battery_max_charge_power: 5000
      battery_max_discharge_power: 5000
      inverter_max_power: 20000
    loads:
      - entity_id: "plug_1"
        device_type: "plug"
        operating_mode: "Excess"
        power_rating: 2000
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      plug_1:
        allocated: 0.0  # Excess load on the importing phase - refused

  - name: "3ph-bat-excess-plug-on-an-exporting-phase-stays-on"
    description: >
      The export-displaced stay-on property (ISSUES.md #41) with the plug where
      an Excess load is allowed to run: the SAME unbalanced site as above -
      15 A/phase of solar, 10 A of household on phase A, the battery pinned at
      its 5 kW charge allowance, a 2 kW trigger - but the plug on phase B,
      which exports 7.75 A rather than importing.
      Net margin -2.25 + 7.75 + 7.75 = 13.25 A = 3047 W, plus 5000 W of charge
      against a 7000 W allowance = +1047 W, so Excess is on and phase B's own
      position is comfortably positive. The plug is binary, so it takes its
      whole 2 kW rating even though the pool is smaller - accepted, because the
      overshoot costs export and never import.
      Its draw comes off export (the battery has no headroom to give any back),
      the reconstruction hands the whole 2 kW back, and the margin reads +1047 W
      with the plug running just as it does with it off: on for all 30 cycles.
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 10350  # 15 A per phase
      phase_a_consumption: 10.0
      phase_b_consumption: 0
      phase_c_consumption: 0
      excess_export_threshold: 2000
      battery_soc: 60
      battery_soc_min: 20
      battery_soc_target: 80
      battery_soc_full: 97
      battery_max_charge_power: 5000
      battery_max_discharge_power: 5000
      inverter_max_power: 12000
    loads:
      - entity_id: "plug_1"
        device_type: "plug"
        operating_mode: "Excess"
        power_rating: 2000
        phases: 1
        priority: 1
        l1_phase: "B"
    expected:
      plug_1:
        allocated: 8.7  # 2000 W / 230 V - on, and stays on

  # --- The start edge: the verdict starts the load, the pool only sizes it ----

  - name: "3ph-bat-excess-evse-at-the-trigger-starts-at-min"
    description: >
      The live site the start-at-minimum rule is for. 20 A/phase of solar,
      1 A/phase of household, and the battery pinned at the 4830 W its charge
      limit permits - everything the site can absorb - leaves 36 A of export
      against a 36 A allowance. The margin is 0: Excess is on (nothing more can
      be placed) and yet the pool it hands out is 0 A.
      The EVSE cannot charge below 6 A, so a pool-sized permit would leave it at
      0 through the whole window; the floor starts it at its minimum instead,
      the way the binary Excess loads have always engaged. Its 18 A then comes
      out of export and the feedback loop hands it back, so the margin reads 0
      again with the load running and it holds at 6 A for all 30 cycles.
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 25
      distribution_mode: priority
      solar_production: 13800  # 20 A per phase
      phase_a_consumption: 1.0
      phase_b_consumption: 1.0
      phase_c_consumption: 1.0
      excess_export_threshold: 8280  # 36 A - exactly the export
      battery_soc: 70
      battery_soc_min: 20
      battery_soc_target: 80
      battery_soc_full: 97
      battery_max_charge_power: 4830   # 21 A, and the battery is taking all of it
      battery_max_discharge_power: 4830
      inverter_max_power: 15000
    loads:
      - entity_id: "load_1"
        operating_mode: Excess
        min_current: 6
        max_current: 16
        phases: 3
        priority: 1
    expected:
      load_1:
        allocated: 6.0  # Margin 0 → the verdict is on → starts at its minimum
