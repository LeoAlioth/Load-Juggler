        phases: 3
        priority: 1
    expected:
      load_1:
        allocated: 16  # 35-3+18=50A available. 50/3=16.7A per phase → 16A (fixed)

  - name: "3ph-2c-solar-wide-range-chargers"
    description: "Mix of chargers with different capabilities"
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 32
      max_import_power: 22080

      distribution_mode: priority
      solar_production: 14950  # 65A total
      phase_a_consumption: 1.0
      phase_b_consumption: 1.0
      phase_c_consumption: 1.0
      battery_soc: 85
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 5060  # 22A
      battery_max_discharge_power: 5060  # 22A
      inverter_supports_asymmetric: true
      inverter_max_power_per_phase: 8050  # 35A
      inverter_max_power: 20700  # 90A
    loads:
      - entity_id: "load_1"
        operating_mode: "Solar Only"
        min_current: 6
        max_current: 32  # Wide range
        phases: 3
        priority: 1
      - entity_id: "load_2"
        operating_mode: "Solar Only"
        min_current: 6
        max_current: 16  # Standard range
        phases: 3
        priority: 2
    expected:
      load_1:
        allocated: 22  # 65-3+22=84A. Pass 1: both get 6A (36A). Pass 2: C1 gets remainder. (84-36)/3=16A, results in 22A total
      load_2:
        allocated: 6  # Gets minimum in pass 1

  # ===== MULTI-CHARGER PRIORITY EDGE CASES =====

  - name: "3ph-4c-solar-many-chargers"
    description: "Four chargers competing for limited power"
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 32
      max_import_power: 22080

      distribution_mode: priority
      solar_production: 11500  # 50A total
      phase_a_consumption: 1.0
      phase_b_consumption: 1.0
      phase_c_consumption: 1.0
      battery_soc: 85
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 4140  # 18A
