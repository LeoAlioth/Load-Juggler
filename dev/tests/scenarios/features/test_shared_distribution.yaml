# Test scenarios: Shared distribution round mechanics
# Covers the two defects of the batched equal-split round in
# _distribute_per_phase_shared:
#   A) a load whose own phases are physically exhausted must not pin the
#      equal-split share at 0 and freeze the loads that still have headroom
#   B) source-overshoot scaling must aim at the loads bound to that source,
#      not at every load in the round

scenarios:

  # ===== A) EXHAUSTED PHASE MUST NOT FREEZE THE ROUND =====

  - name: "shared-exhausted-phase-frees-other-phase"
    description: >
      Two 1-phase EVSEs on different phases of a 20 A breaker, no solar.
      Phase A carries a 14 A household draw, phase B only 2 A, so the
      grid pool is A = 20 - 14 = 6 A, B = 20 - 2 = 18 A, C = 20 - 0.5 = 19.5 A
      (no solar or battery, so the inverter adds nothing).
      Pass 1 reserves both minimums: load_a takes 6 A, which exhausts
      phase A exactly (14 + 6 = 20 = breaker); load_b takes 6 A, leaving
      B = 18 - 6 = 12 A.
      Pass 2: load_a's own headroom is 0 A, so it cannot receive anything
      and drops out of the round; load_b is alone in the wanting set and
      takes the whole remaining share, min(12 A headroom, 16 - 6 = 10 A) = 10 A,
      reaching its 16 A max (2 + 16 = 18 A, inside the 20 A breaker).
      Expected: load_a = 6.0 A (its minimum, all phase A allows),
      load_b = 6 + 10 = 16.0 A.
      Before the fix load_a stayed in the wanting set with 0 A available,
      pinning the equal share at 0 and breaking the loop, which froze
      load_b at its 6 A minimum despite 12 A free on phase B.
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 20
      distribution_mode: Shared
      solar_production: 0
      phase_a_consumption: 14.0
      phase_b_consumption: 2.0
      phase_c_consumption: 0.5
    loads:
      - entity_id: "load_a"
        operating_mode: "Standard"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 1
        l1_phase: "A"
      - entity_id: "load_b"
        operating_mode: "Standard"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 2
        l1_phase: "B"
    expected:
      load_a:
        allocated: 6.0   # phase A exhausted by the household - minimum only
      load_b:
        allocated: 16.0  # fills its max from the 12 A free on phase B

  # ===== B) PER-SOURCE OVERSHOOT SCALING =====

  - name: "shared-solar-pair-overshoot-scaled"
    description: >
      Two Solar Only EVSEs share phase A while a Standard EVSE sits on phase C,
      whose household draw leaves it no solar at all - the case that used to
      switch the overshoot guard OFF (min_solar = 0).
      Solar 13800/3 = 20 A per phase; household A = B = 2 A, C = 22 A. Export
      per phase is therefore 20 - 2 = 18 A on A and B, and 20 - 22 < 0 on C,
      i.e. nothing. The solar pool is the measured export: A = 18 A, B = 18 A,
      C = 0 A.
      Pass 1: Standard on C takes 6 A (no solar on C to deduct);
      solar_1 takes 6 A (solar A 18 -> 12), solar_2 takes 6 A (12 -> 6).
      Pass 2 round 1: physical headroom is ample, so the equal share exceeds
      every load's own ceiling. Each Solar Only load is individually offered
      min(16, 6 + 6) - 6 = 6 A - both fit the 6 A left on phase A on their own,
      but 6 + 6 = 12 A is double the pool. Per-source scaling multiplies only
      those two increments by 6/12 = 0.5, giving +3 A each; the Standard load's
      increment is untouched and it fills to 16 A.
      Expected: solar_1 = solar_2 = 6 + 3 = 9.0 A (18 A of solar drawn in
      total, exactly the phase A surplus), load_std = 16.0 A.
      Before the fix the guard "total > min_solar > 0" saw min_solar = 0 from
      the Standard load's solar-free phase C and skipped scaling entirely, so
      both Solar Only loads took their full 6 A increment and ended at 12.0 A
      each - 24 A of solar drawn against an 18 A surplus.
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: Shared
      solar_production: 13800   # 20 A per phase
      phase_a_consumption: 2.0
      phase_b_consumption: 2.0
      phase_c_consumption: 22.0
    loads:
      - entity_id: "load_std"
        operating_mode: "Standard"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 1
        l1_phase: "C"
      - entity_id: "solar_1"
        operating_mode: "Solar Only"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 2
        l1_phase: "A"
      - entity_id: "solar_2"
        operating_mode: "Solar Only"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 3
        l1_phase: "A"
    expected:
      load_std:
        allocated: 16.0  # grid-backed: never scaled by a solar shortfall
      solar_1:
        allocated: 9.0   # 6 + 6 * (6/12)
      solar_2:
        allocated: 9.0   # 6 + 6 * (6/12)

  - name: "shared-excess-pair-overshoot-scaled"
    description: >
      The excess-pool twin of the solar case: two Excess EVSEs share phase A
      and a Standard EVSE sits on phase C, whose household draw leaves it
      importing.
      Solar 24150/3 = 35 A per phase; household A = B = 2 A, C = 45 A. The
      per-phase position is therefore 33/33/-10 A - phase C imports, because
      its 45 A of household exceeds its 35 A of solar. The verdict and the pool
      read that NET (2026-09-07): 56 A = 12880 W, which is the site's true
      position (24150 W of solar less 11270 W of household), so against a
      3680 W export threshold the excess margin is 9200 W = 40 A. The pool
      bounds each phase by its OWN position and the site by that margin:
      33/33/0 A with a 40 A total.
      It used to spread the site-total terms evenly instead (-16/3 A each,
      giving 27.67/27.67/-15.33 A), which charged phase A a share of an export
      limit that is contractually a site TOTAL (2026-09-08: a 3x25 A
      connection exporting 15/20/25 A is compliant, not pegged at 20/20/20).
      Phase A really exports 33 A.
      Pass 1: the Standard load on C takes 6 A from the PHYSICAL pool and
      leaves the excess pool alone - a grid-backed load is meant to import, so
      phase C being negative does not stop it. excess_1 takes 6 A (excess A
      33 -> 27), excess_2 takes 6 A (27 -> 21).
      Pass 2 round 1: each Excess load is offered min(16, 6 + 21) - 6 = 10 A,
      and 10 + 10 = 20 A FITS the 21 A left on phase A, so nothing is scaled
      and both fill to 16 A. Two loads at 16 A draw 32 A on phase A, leaving it
      exporting 1 A, and take 32 A of the 40 A margin - inside both bounds.
      Expected: excess_1 = excess_2 = 16.0 A, load_std = 16.0 A.
      The per-source SCALING this scenario was written for is no longer
      exercised here, because phase A has the room. It moved to
      shared-excess-pair-scaled-by-the-site-total below, which tightens the
      threshold so the site total binds instead of the phase.
      Read GROSS this site would show 66 A of export (phase C's 10 A of import
      clamped away), which is still the right figure for the export LIMIT - a
      contractual limit counts exported flow per phase. It is the wrong figure
      for SURPLUS, which is what this pool rations: a load cannot take the 10 A
      phase C is pulling in. With no battery here there is no charge headroom
      for the load-off reconstruction to give anything back either way.
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: Shared
      solar_production: 24150   # 35 A per phase
      excess_export_threshold: 3680
      phase_a_consumption: 2.0
      phase_b_consumption: 2.0
      phase_c_consumption: 45.0
    loads:
      - entity_id: "load_std"
        operating_mode: "Standard"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 1
        l1_phase: "C"
      - entity_id: "excess_1"
        operating_mode: "Excess"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 2
        l1_phase: "A"
      - entity_id: "excess_2"
        operating_mode: "Excess"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 3
        l1_phase: "A"
    expected:
      load_std:
        allocated: 16.0  # grid-backed: never scaled by an excess shortfall
      excess_1:
        allocated: 16.0  # phase A holds 33 A; two at 16 A leave it exporting 1 A
      excess_2:
        allocated: 16.0

  - name: "shared-excess-pair-scaled-by-the-site-total"
    description: >
      The per-source overshoot scaling, kept from the scenario above once a
      roomy phase A stopped exercising it. Same site, but a 5980 W export
      threshold instead of 3680 W, so the margin is 12880 - 5980 = 6900 W =
      30 A and the SITE TOTAL binds where the phase does not.
      The pool is 30/30/0 A with a 30 A total: phase A's own 33 A is now
      clamped by the margin, which is the other half of ``min(total, flow)``
      and is asserted nowhere else.
      Pass 1: excess_1 and excess_2 take 6 A each, leaving 18 A. Pass 2: each
      is offered min(16, 6 + 18) - 6 = 10 A, but 10 + 10 = 20 A overdraws the
      18 A left, so per-source scaling multiplies both increments by 18/20 =
      0.9 for +9 A each. The Standard load is grid-backed and its increment is
      untouched, so it still fills to 16 A.
      Expected: excess_1 = excess_2 = 15.0 A, load_std = 16.0 A. The pair draw
      30 A on phase A, which is exactly the margin and still leaves phase A
      exporting 3 A of its own 33 A.
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: Shared
      solar_production: 24150
      excess_export_threshold: 5980
      phase_a_consumption: 2.0
      phase_b_consumption: 2.0
      phase_c_consumption: 45.0
    loads:
      - entity_id: "load_std"
        operating_mode: "Standard"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 1
        l1_phase: "C"
      - entity_id: "excess_1"
        operating_mode: "Excess"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 2
        l1_phase: "A"
      - entity_id: "excess_2"
        operating_mode: "Excess"
        min_current: 6
        max_current: 16
        phases: 1
        priority: 3
        l1_phase: "A"
    expected:
      load_std:
        allocated: 16.0
      excess_1:
        allocated: 15.0
      excess_2:
        allocated: 15.0
