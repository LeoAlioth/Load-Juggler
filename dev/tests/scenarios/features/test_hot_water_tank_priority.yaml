      distribution_mode: priority
      solar_production: 1500
      phase_a_consumption: 0.0
      battery_soc: 50
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 4000
      battery_max_discharge_power: 5000
      inverter_max_power: 2100
      inverter_max_power_per_phase: 2100
      inverter_supports_asymmetric: false
      inverter_output_sensors: true
      wiring_topology: series
    loads:
      - entity_id: "pond_pump"
        device_type: "plug"
        operating_mode: "Solar Priority"
        power_rating: 1400
        phases: 1
        priority: 1
        l1_phase: "A"
      - entity_id: "power_strip"
        device_type: "plug"
        operating_mode: "Solar Priority"
        power_rating: 200
        phases: 1
        priority: 2
        l1_phase: "A"
      - entity_id: "water_tank"
        device_type: "hot_water_tank"
        operating_mode: "Solar Priority"
        power_rating: 2000
        phases: 1
        priority: 3
        current_temperature: 47
        normal_temperature: 45
        prioritize_below_normal: true
        l1_phase: "A"
    expected:
      pond_pump:
        allocated: 6.1    # 1400 W
      power_strip:
        allocated: 0.9    # 200 W - fits in remaining pool
      water_tank:
        allocated: 0.0    # 2 kW does not fit after pond + strip

  - name: "tank-cold-but-promotion-disabled-keeps-priority"
