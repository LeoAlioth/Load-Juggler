# Two Excess loads on one site - do they start in rank order?
#
# The SE17K case (2026-09-07). A hot water tank boosting on surplus and a
# portable power station, both competing in the Excess urgency tier, started
# TOGETHER on a 74 W margin and committed 4.1 kW three times in fifteen
# minutes under steady production. The rule they now obey: the verdict starts
# the FIRST Excess consumer, and a lower-ranked one starts only while the
# surplus left after the higher-ranked load's CLAIM is still positive.
#
# The tank is what makes these scenarios worth having. It is in Normal mode -
# heating to 45 °C from any source - but with the verdict on, the control layer
# raises its setpoint to boost and `tank_boost_is_opportunistic` turns it into
# a BINARY_EXCESS load competing at the Excess tier. Until this file the
# harness never resolved that label at all, so a tank was always must-run and
# this whole path was unreachable.
#
# Site: 11 kW export limit less a 500 W trigger margin → a 10 500 W threshold,
# 900 W of household spread over three phases, no battery. Margin therefore
# works out to (solar − 900) − 10 500, which is what each case's solar picks.

scenarios:

  - name: "excess-two-loads-thin-surplus-only-the-tank-starts"
    description: >
      Solar 11 600 W → reconstruction 10 700 W → a margin of +200 W. The tank
      outranks the station and claims its whole 2 kW element (a claim is the
      permit, not the not-yet-measured draw), so what is left for the station
      is 200 − 2000 < 0 and it must wait. This is the SE17K failure exactly:
      before the rank ledger both engaged here and committed 4.1 kW on 200 W.
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 25
      distribution_mode: priority
      solar_production: 11600
      solar_production_direct: true
      phase_a_consumption: 1.3
      phase_b_consumption: 1.3
      phase_c_consumption: 1.3
      excess_export_threshold: 10500
    loads:
      - entity_id: "tank"
        device_type: "hot_water_tank"
        operating_mode: "Normal"
        power_rating: 2000
        phases: 1
        priority: 1
        current_temperature: 45
        normal_temperature: 45
        l1_phase: "B"
      - entity_id: "station"
        device_type: "power_station"
        operating_mode: "Excess"
        min_current: 0.87
        max_current: 10.43
        phases: 1
        priority: 2
        l1_phase: "C"
    expected:
      tank:
        allocated: 8.7      # 2000 W / 230 V - the whole element
      station:
        allocated: 0.0      # nothing left after the tank's claim

  - name: "excess-two-loads-wide-surplus-both-run-flat-out"
    description: >
      Solar 16 000 W → reconstruction 15 100 W → a margin of +4600 W. The tank
      takes its 2 kW and 2 600 W survives its claim, which COVERS the station's
      2 399 W rating with 204 W to spare, so it runs flat out.
      It used to settle at 6.7 A, and this description used to explain that as
      "phase C's own third of the net pool". That third was the defect: the
      export threshold is a site TOTAL, so charging phase C a third of it
      bounded the load by a quantity that does not exist. Phase C really
      exports 5 034 W here and still exports 2 635 W with the station at its
      maximum, so nothing was protecting anything - 851 W of surplus was simply
      left unabsorbed.
      The modulating case this scenario used to cover moved to
      excess-two-loads-narrow-surplus-sizes-the-station, where the surplus is
      genuinely smaller than the station's rating.
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 25
      distribution_mode: priority
      solar_production: 16000
      solar_production_direct: true
      phase_a_consumption: 1.3
      phase_b_consumption: 1.3
      phase_c_consumption: 1.3
      excess_export_threshold: 10500
    loads:
      - entity_id: "tank"
        device_type: "hot_water_tank"
        operating_mode: "Normal"
        power_rating: 2000
        phases: 1
        priority: 1
        current_temperature: 45
        normal_temperature: 45
        l1_phase: "B"
      - entity_id: "station"
        device_type: "power_station"
        operating_mode: "Excess"
        min_current: 0.87
        max_current: 10.43
        phases: 1
        priority: 2
        l1_phase: "C"
    expected:
      tank:
        allocated: 8.7
      station:
        # Its full 10.43 A rating, because 2 600 W of surplus survives the
        # tank's claim and the station can only take 2 399 W of it.
        allocated: 10.4

  - name: "excess-two-loads-narrow-surplus-sizes-the-station"
    description: >
      The modulating half, kept from the scenario above once a wide surplus
      stopped exercising it. Solar 14 900 W → reconstruction 14 003 W → a
      margin of 3 503 W = 15.23 A. The tank claims 8.70 A and 6.53 A survives,
      which is well under the station's 10.43 A rating, so the station is SIZED
      by what is left rather than handed its maximum.
      Phase C is not the constraint and is asserted not to be: it exports
      4 668 W = 20.3 A, three times what the station receives. The SITE TOTAL
      after the tank's claim is what binds, which is the whole point of the
      pool carrying its total as its own quantity.
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 25
      distribution_mode: priority
      solar_production: 14900
      solar_production_direct: true
      phase_a_consumption: 1.3
      phase_b_consumption: 1.3
      phase_c_consumption: 1.3
      excess_export_threshold: 10500
    loads:
      - entity_id: "tank"
        device_type: "hot_water_tank"
        operating_mode: "Normal"
        power_rating: 2000
        phases: 1
        priority: 1
        current_temperature: 45
        normal_temperature: 45
        l1_phase: "B"
      - entity_id: "station"
        device_type: "power_station"
        operating_mode: "Excess"
        min_current: 0.87
        max_current: 10.43
        phases: 1
        priority: 2
        l1_phase: "C"
    expected:
      tank:
        allocated: 8.7
      station:
        allocated: 6.5
