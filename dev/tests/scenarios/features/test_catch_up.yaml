  # 3 phases, symmetric inverter: 24150 W of sun (35 A a phase), 2 A house a phase,
  # battery 60 % charging at 6900 W; the 3-phase 16 A load's maximum is 11 040 W.
  - name: "catch-up-3ph-solar-only-starts-below-target"
    description: "Planned 11.04 kWh in 1 h = the 3-phase load's maximum: Solar Only starts at 60 %"
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 35
      distribution_mode: priority
      solar_production: 24150
      phase_a_consumption: 2.0
      phase_b_consumption: 2.0
      phase_c_consumption: 2.0
      battery_soc: 60
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 6900
      battery_max_discharge_power: 5000
      inverter_supports_asymmetric: false
      inverter_max_power_per_phase: 12000
      inverter_max_power: 36000
      catch_up: {energy_kwh: 11.04, hours_left: 1}
    loads:
      - entity_id: "load_1"
        operating_mode: "Solar Only"
        min_current: 6
        max_current: 16
        phases: 3
        priority: 1
        catch_up: true
    expected:
      load_1:
        allocated: 16.0

  - name: "catch-up-3ph-solar-only-can-keep-up"
    description: "Planned 9 kWh in 1 h is under the 3-phase load's 11 040 W maximum: it waits for the target"
    human_verified: false
    site:
      voltage: 230
      main_breaker_rating: 35
      distribution_mode: priority
      solar_production: 24150
      phase_a_consumption: 2.0
      phase_b_consumption: 2.0
      phase_c_consumption: 2.0
      battery_soc: 60
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 6900
      battery_max_discharge_power: 5000
      inverter_supports_asymmetric: false
      inverter_max_power_per_phase: 12000
      inverter_max_power: 36000
      catch_up: {energy_kwh: 9, hours_left: 1}
    loads:
      - entity_id: "load_1"
        operating_mode: "Solar Only"
        min_current: 6
        max_current: 16
        phases: 3
        priority: 1
        catch_up: true
    expected:
      load_1:
        allocated: 0.0

  # Off-grid (no grid CTs): the same algorithm over the inverter's own flow.
