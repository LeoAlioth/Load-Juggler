# Test scenarios: Off-grid site - inverter limit must be respected
#
# An off-grid site has no grid CTs (production injects 0 A grid readings for
# phases with inverter output sensors), so ALL power flows through the
# inverter. Regression tests for three off-grid bugs found 2026-06-11:
#   1. _calculate_grid_limit produced phantom main-breaker headroom
#      (breaker − 0 A consumption) even though no grid feed exists.
#   2. _calculate_inverter_limit ignored the household the inverter must keep
#      serving - invisible off-grid because no grid CT ever sees it.
#   3. _apply_feedback_loop subtracted charger draws from the synthetic 0 A
#      grid readings, fabricating export equal to the charger's own draw.
#
# Field snapshot behind scenario 1: 1-phase off-grid, 4 kW hybrid inverter,
# 5 kW battery discharge, solar 1465 W, household ~2.6 kW, 1.75 kW boiler on
# a smart plug. Inverter output was 4357 W - past its 4 kW rating - yet the
# boiler was never shed.

scenarios:

  - name: "off-grid-inverter-full-sheds-plug"
    description: "Off-grid 4kW inverter, household 2.6kW + solar 1.5kW → no room for 1.75kW boiler → plug OFF"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 20
      distribution_mode: priority
      solar_production: 1465
      phase_a_consumption: 11.3   # household ≈ 2600 W
      battery_soc: 89
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 4500
      battery_max_discharge_power: 5000
      inverter_max_power: 4000
      inverter_max_power_per_phase: 4000
      inverter_supports_asymmetric: false
      inverter_output_sensors: true
      wiring_topology: series
    loads:
      - entity_id: "boiler"
        device_type: "plug"
        operating_mode: "Solar Priority"
        power_rating: 1750
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      boiler:
        # Inverter capacity left for managed loads = 4000 W − 2600 W household
        # ≈ 6.1 A < the boiler's 7.6 A → must be shed. Before the fixes the
        # pool showed ~35 A (20 A phantom grid + household-blind inverter).
        allocated: 0.0
        available: 0.0

  - name: "off-grid-inverter-headroom-keeps-plug"
    description: "Off-grid 8kW inverter, same loads → boiler fits within inverter headroom → plug ON"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 20
      distribution_mode: priority
      solar_production: 1465
      phase_a_consumption: 11.3   # household ≈ 2600 W
      battery_soc: 89
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 4500
      battery_max_discharge_power: 5000
      inverter_max_power: 8000
      inverter_max_power_per_phase: 8000
      inverter_supports_asymmetric: false
      inverter_output_sensors: true
      wiring_topology: series
    loads:
      - entity_id: "boiler"
        device_type: "plug"
        operating_mode: "Solar Priority"
        power_rating: 1750
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      boiler:
        # 8000 W − 2600 W household ≈ 23 A of inverter capacity; source pool
        # (solar + spare battery discharge) also covers 7.6 A → stays on.
        allocated: 7.6

  - name: "off-grid-no-household-keeps-plug"
    description: "Off-grid 4kW inverter, no household load → boiler fits → plug ON (no over-shedding)"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 20
      distribution_mode: priority
      solar_production: 1465
      phase_a_consumption: 0.0
      battery_soc: 89
      battery_soc_min: 20
      battery_soc_target: 80
      battery_max_charge_power: 4500
      battery_max_discharge_power: 5000
      inverter_max_power: 4000
      inverter_max_power_per_phase: 4000
      inverter_supports_asymmetric: false
      inverter_output_sensors: true
      wiring_topology: series
    loads:
      - entity_id: "boiler"
        device_type: "plug"
        operating_mode: "Solar Priority"
        power_rating: 1750
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      boiler:
        # Full 4000 W (17.4 A) inverter capacity available → 7.6 A boiler on.
        allocated: 7.6

  # Off-grid with a solar production sensor and NO inverter output sensors:
  # the household total is solar + battery - export, and export is 0 with no
  # grid - so it is the inverter's whole supply, our own charger included.
  # Grid-tied the feedback loop has already put the managed draws back onto
  # the export; off-grid it does not touch the synthetic zero phases, so the
  # draws have to come off the supply itself. Before 2026-09-24 they did not,
  # and the car's own draw was read as house load: allowance - car = car, and
  # it settled at about half the inverter's rating less the house.
  - name: "off-grid-solar-sensor-charger-gets-inverter-rating"
    description: "Off-grid, solar sensor, no output sensors: 6kW inverter, 1kW house → charger 21.7A, its own draw not counted as house load"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 2000
      solar_production_direct: true
      phase_a_consumption: 4.35   # household ≈ 1000 W
      battery_soc: 80
      battery_soc_min: 20
      battery_soc_target: 50
      battery_max_charge_power: 5000
      battery_max_discharge_power: 20000
      inverter_max_power: 6000
      wiring_topology: series
    loads:
      - entity_id: "car"
        min_current: 6
        max_current: 32
        phases: 1
        priority: 1
        l1_phase: "A"
        operating_mode: "Standard"
    expected:
      car:
        # 6000 W / 230 V = 26.09 A of inverter, less the 4.35 A house = 21.7 A.
        # With the car's own draw left in the household it settled at 10.9 A.
        allocated: 21.7

# ── Battery-limited off-grid: a managed load keeps the supply it holds ──────
#
# Found 2026-09-24 while testing the stuck-readout fix (9660cfc): with a
# CORRECT meter reading, a 3 kW car behind a 1 kW house on a 5 kW battery was
# permitted 0. Off-grid the battery's discharge in flight carries the car's own
# draw, and the pool was sized as ``solar + (max discharge - discharge in
# flight)`` - so the 3 kW the car already held was booked as spent, leaving
# 1 kW (4.3 A, under its 6 A minimum). Cut to 0 the discharge falls back to the
# house, the 4 kW returns, the car is allowed again: it hunts. Grid-tied the
# feedback loop hands every managed draw back as export; off-grid it returns
# early (no CT reading ever contained the draws), so nothing handed it back.
# Correct: supply capacity minus the household, i.e.
# ``solar + max discharge - household`` = 5000 - 1000 = 4000 W for the car.
# None of the scenarios above reached it - their plugs fit either way.
#
# The harness's off-grid battery now covers every deficit, past its rating and
# below the SOC floor alike (nothing else can, off-grid), and invariant C in
# run_tests.check_physical_invariants fails any scenario whose loads take the
# pack past its rating, below its floor, or the inverter past its own.

  - name: "off-grid-battery-limited-car-keeps-its-3kw"
    description: "Off-grid night, 1 kW house, 5 kW battery, a 3 kW (13 A) car → keeps its 13 A (before the fix: cut, hunting)"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 0
      phase_a_consumption: 4.35   # household ≈ 1000 W
      battery_soc: 80
      battery_soc_min: 20
      battery_soc_target: 50
      battery_max_charge_power: 5000
      battery_max_discharge_power: 5000
      inverter_output_sensors: true
      wiring_topology: series
    loads:
      - entity_id: "car"
        operating_mode: "Standard"
        min_current: 6
        max_current: 13
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      car:
        # 5000 W - 1000 W household = 4000 W (17.4 A) of battery for the car;
        # its own 13 A cap binds.
        allocated: 13.0

  - name: "off-grid-battery-limited-car-gets-the-4kw"
    description: "Same site, a 32 A car → the battery's 4 kW left after the house (17.4 A), and not more"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 0
      phase_a_consumption: 4.35   # household ≈ 1000 W
      battery_soc: 80
      battery_soc_min: 20
      battery_soc_target: 50
      battery_max_charge_power: 5000
      battery_max_discharge_power: 5000
      inverter_output_sensors: true
      wiring_topology: series
    loads:
      - entity_id: "car"
        operating_mode: "Standard"
        min_current: 6
        max_current: 32
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      car:
        # (5000 - 1000) / 230 = 17.4 A. The battery then discharges exactly its
        # 5 kW rating.
        allocated: 17.4

  - name: "off-grid-battery-limited-car-with-solar"
    description: "Off-grid day, 1.5 kW solar, 2.6 kW house, 5 kW battery → car gets solar + battery - house (17.0 A)"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 1500
      phase_a_consumption: 11.3   # household ≈ 2600 W
      battery_soc: 80
      battery_soc_min: 20
      battery_soc_target: 50
      battery_max_charge_power: 5000
      battery_max_discharge_power: 5000
      inverter_output_sensors: true
      wiring_topology: series
    loads:
      - entity_id: "car"
        operating_mode: "Standard"
        min_current: 6
        max_current: 32
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      car:
        # (1500 + 5000 - 2599) / 230 = 16.96 A. Before the fix the pool was
        # solar + (max - discharge in flight), which both books the car's own
        # draw as spent and counts the solar the house is already using.
        allocated: 17.0

  - name: "off-grid-solar-only-car-keeps-its-surplus"
    description: "Off-grid, battery AT its target, 4 kW solar, 1 kW house → Solar Only car keeps the 3 kW surplus (13.0 A)"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 4000
      phase_a_consumption: 4.35   # household ≈ 1000 W
      battery_soc: 80
      battery_soc_min: 20
      battery_soc_target: 80      # at target: no discharge surplus, pure solar
      battery_max_charge_power: 5000
      battery_max_discharge_power: 5000
      inverter_output_sensors: true
      wiring_topology: series
    loads:
      - entity_id: "car"
        operating_mode: "Solar Only"
        min_current: 6
        max_current: 32
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      car:
        # Surplus = solar - household = 3000 W = 13.0 A. The solar pool is the
        # same shape of bug: its only term off-grid was the battery's charge
        # rate, which the car's own draw takes away one-for-one.
        allocated: 13.0

  - name: "off-grid-solar-entity-battery-limited-car"
    description: "Off-grid, dedicated solar sensor only (no inverter output sensors), 1.5 kW solar, 2.6 kW house, 5 kW battery → 17.0 A"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 1500
      solar_production_direct: true
      phase_a_consumption: 11.3   # household ≈ 2600 W
      battery_soc: 80
      battery_soc_min: 20
      battery_soc_target: 50
      battery_max_charge_power: 5000
      battery_max_discharge_power: 5000
      wiring_topology: series
    loads:
      - entity_id: "car"
        operating_mode: "Standard"
        min_current: 6
        max_current: 32
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      car:
        # Same 16.96 A. With a dedicated solar sensor the pool was the other
        # error on the same term: solar + the FULL discharge rating, the
        # household never taken off - 28.3 A offered, 7.6 kW asked of a 5 kW
        # battery.
        allocated: 17.0

  - name: "off-grid-solar-entity-night-car-does-not-overdraw-battery"
    description: "Off-grid night, dedicated solar sensor only, 1 kW house, 5 kW battery → 17.4 A, not the full 5 kW (21.7 A)"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 0
      solar_production_direct: true
      phase_a_consumption: 4.35   # household ≈ 1000 W
      battery_soc: 80
      battery_soc_min: 20
      battery_soc_target: 50
      battery_max_charge_power: 5000
      battery_max_discharge_power: 5000
      wiring_topology: series
    loads:
      - entity_id: "car"
        operating_mode: "Standard"
        min_current: 6
        max_current: 32
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      car:
        # Same error at night: the full rating with the house never taken off
        # - 21.7 A offered, 6 kW asked of a 5 kW battery.
        allocated: 17.4

  - name: "off-grid-solar-entity-inverter-limited-car"
    description: "Off-grid, dedicated solar sensor only, 4 kW inverter, 1 kW house, 1.5 kW solar → car gets the inverter's 3 kW (13.0 A)"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 1500
      solar_production_direct: true
      phase_a_consumption: 4.35   # household ≈ 1000 W
      battery_soc: 80
      battery_soc_min: 20
      battery_soc_target: 50
      battery_max_charge_power: 5000
      battery_max_discharge_power: 5000
      inverter_max_power: 4000
      wiring_topology: series
    loads:
      - entity_id: "car"
        operating_mode: "Standard"
        min_current: 6
        max_current: 32
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      car:
        # (4000 - 1000) / 230 = 13.0 A: the inverter binds, not the battery.
        # Its capacity is sized on the household, and with only a solar
        # sensor that is solar + battery - off-grid the WHOLE site, the car's
        # own draw included, until the managed draws are taken off it
        # (engine/hub_calculation._apply_household_figures).
        allocated: 13.0

  - name: "off-grid-below-soc-min-car-gets-solar-surplus-only"
    description: "Off-grid, battery BELOW its SOC minimum, 3 kW solar, 1 kW house → car gets the 2 kW surplus (8.7 A), never the pack"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 3000
      phase_a_consumption: 4.35   # household ≈ 1000 W
      battery_soc: 15
      battery_soc_min: 20
      battery_soc_target: 50
      battery_max_charge_power: 5000
      battery_max_discharge_power: 5000
      inverter_output_sensors: true
      wiring_topology: series
    loads:
      - entity_id: "car"
        operating_mode: "Standard"
        min_current: 6
        max_current: 32
        phases: 1
        priority: 1
        l1_phase: "A"
    expected:
      car:
        # Below the floor the discharge rating drops out of the pool and the
        # flow in flight still comes off, leaving solar - household = 2000 W.
        # Before the fix the pool was the solar alone - the house never taken
        # off - and the car's extra 1 kW came out of a pack below its minimum.
        allocated: 8.7

  # Off-grid with inverter output sensors and PARALLEL wiring - the setup
  # form's default. Parallel reconstructs the household as grid consumption +
  # output - grid export, which grid-tied is right because the feedback loop
  # has taken the managed draws off the grid terms. Off-grid those terms are
  # synthetic zeros it leaves alone, and with no grid everything the site
  # consumes comes out of the inverter, so the output carries the charger too.
  # Before 2026-09-24 nothing took it off: the car's own draw was read as house
  # load and it settled at about half the inverter's rating less the house.
  # Same rig as the series formula, which always took the draw off.
  - name: "off-grid-parallel-output-charger-gets-inverter-rating"
    description: "Off-grid, parallel wiring, output sensors: 6kW inverter, 1kW house → charger 21.7A, its own draw not counted as house load"
    human_verified: false
    site:
      off_grid: true
      voltage: 230
      main_breaker_rating: 40
      distribution_mode: priority
      solar_production: 0         # night: the battery supplies the whole output
      phase_a_consumption: 4.35   # household ≈ 1000 W
      battery_soc: 80
      battery_soc_min: 20
      battery_soc_target: 50
      battery_max_charge_power: 5000
      battery_max_discharge_power: 20000
      inverter_max_power: 6000
      inverter_output_sensors: true
      wiring_topology: parallel
    loads:
      - entity_id: "car"
        min_current: 6
        max_current: 32
        phases: 1
        priority: 1
        l1_phase: "A"
        operating_mode: "Standard"
    expected:
      car:
        # 6000 W / 230 V = 26.09 A of inverter, less the 4.35 A house = 21.7 A.
        # With the car's own draw left in the household it settled at 10.9 A.
        allocated: 21.7
